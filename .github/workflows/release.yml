name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARTIFACT: aufseher-linux-amd64
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The archive and the image share one compile: the `binary` stage exports what the final stage
      # copies, and the second build reuses the cached stage. The export goes outside the workspace
      # so that the build context, and with it the cache, stays unchanged.
      - name: Build the binary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binary
          outputs: type=local,dest=${{ runner.temp }}/dist

      - name: Check that the binary runs
        run: '"$RUNNER_TEMP/dist/aufseher" --version'

      - name: Package the binary
        working-directory: ${{ runner.temp }}
        run: |
          mkdir staging
          cp dist/aufseher staging/
          cp "$GITHUB_WORKSPACE"/{LICENSE,README.md,configs/aufseher.service,configs/aufseher.yaml} staging/
          tar -czf "$ARTIFACT.tar.gz" -C staging .
          sha256sum "$ARTIFACT.tar.gz" > "$ARTIFACT.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.ARTIFACT }}.tar.gz*

      # A semver tag also gets `latest`, unless it is a pre-release. A manual run gets no tags.
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: aufseher-linux-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Aufseher ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
